<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- viewport-fit=cover — учитываем вырезы на телефонах -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a120b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>ReactION — химия на смене</title>
  </head>
  <body>
    <!-- 3D-сцена (Three.js рендерит сюда) -->
    <canvas id="scene"></canvas>

    <!-- Слой интерфейса поверх сцены -->
    <div id="ui"></div>

    <!-- Экран «поверни телефон» — показываем только на телефоне в портрете -->
    <div id="rotate-hint" class="rotate-hint" hidden>
      <div class="rotate-hint-inner">
        <div class="rotate-hint-phone" aria-hidden="true"></div>
        <p class="rotate-hint-title">Поверни устройство</p>
        <p class="rotate-hint-text">
          Лаборатория удобнее в горизонтальном положении — так видно весь рабочий стол.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
