# Игровой контейнер: отдаёт статику из смонтированной папки.
#
# GitHub Actions собирает проект и кладёт dist/ на сервер
# (см. .github/workflows/deploy.yml). Контейнер просто раздаёт эту папку,
# поэтому пересборка образа при каждом деплое не нужна.
#
# Внешний порт не публикуем: nginx-proxy-manager ходит по общей docker-сети.

services:
  reaction:
    image: nginx:1.27-alpine
    container_name: reaction-game
    restart: unless-stopped
    networks:
      - npm_network
    volumes:
      # Папка, куда Actions кладёт dist/. Должна совпадать с DEPLOY_PATH.
      - /opt/reaction/dist:/usr/share/nginx/html:ro
      # Конфиг nginx с gzip, кэшем и SPA-fallback
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  # Внешняя сеть, где живёт nginx-proxy-manager.
  # Проверь имя: docker network ls
  npm_network:
    external: true
